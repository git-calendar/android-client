# Tests, builds and signs the release APK and drops it into a DRAFT release, ready for you to write the
# notes and publish.
#
# The APK is signed with the app's key, from the secrets of the `release` environment:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 encoded (`base64 -i release.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key's alias in the keystore
#   ANDROID_KEY_PASSWORD       the key's password
#
# The version comes from app.version.number in gradle.properties instead of a workflow input, so the tag,
# the file name and the version the app reports cannot disagree. The tag is the bare version ("1.0.1"),
# the release title "v1.0.1", like the earlier releases.
#
# One job on purpose: tests, build and release share one checkout, one core download and one Gradle
# daemon. A failing step skips everything after it, so nothing is built or published when a test fails.
name: Release

on:
  workflow_dispatch:

# two runs for the same branch would race to create the same release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # the signing secrets live in this environment
    environment: release
    permissions:
      # creating the release and uploading the APK
      contents: write
    env:
      # The certificate every released APK is signed with. Android only installs an update signed with the
      # same one, so a build signed with anything else must not reach a release. Not a secret: every APK
      # shows it (`apksigner verify --print-certs app.apk`).
      RELEASE_CERT_SHA256: 0c7bbb69febbc92b3ff6273d3c34c2bbee6313756f10729bbe3168dc3e61599d
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Read the version first and stop before building anything if that version is already published.
      - name: Read the version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^app.version.number=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::app.version.number in gradle.properties is missing or not like 1.2.3: '$version'"; exit 1; }
          if [ "$(gh release view "$version" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$version is already published. Bump app.version.number in gradle.properties."
            exit 1
          fi
          # An existing tag wins over --target, so the release would point at other code than the APK.
          tagged=$(git ls-remote --tags origin "refs/tags/$version" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $version already points at ${tagged:0:7}, not at ${GITHUB_SHA:0:7}. Bump app.version.number, or delete the tag if it was never released."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # read only: nothing from a job that holds the signing key is saved where other runs can read it
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # the Go core, at the version pinned in the Makefile
      - name: Download the core
        run: make fetch-core

      # AGP only creates unit tests for the debug build
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest

      # A secret is text, so the keystore is stored base64 encoded. It is written to the runner's temporary
      # folder, readable only by this user, and deleted at the end of the job.
      - name: Write the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the release environment"; exit 1; }
          keystore="$RUNNER_TEMP/release.jks"
          (umask 077 && base64 --decode <<< "$KEYSTORE_BASE64" > "$keystore")
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # the passwords only go to this step, read by the signingConfig in app/build.gradle.kts
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Check the signature and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK - an unsigned build is named app-release-unsigned.apk"; exit 1; }
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          certs="$("$tools/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<< "$certs" ||
            { echo "::error::The APK is not signed with the release certificate - check the keystore secret"; exit 1; }

          built="$("$tools/aapt2" dump badging "$apk" | grep -o "versionName='[^']*'" | cut -d"'" -f2)"
          [ "$built" = "$VERSION" ] || { echo "::error::The APK reports version '$built', expected $VERSION"; exit 1; }

          mkdir -p dist
          cp "$apk" "dist/git-calendar-android-${VERSION}.apk"
          ls -lh dist

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create or update the draft release
        run: |
          set -euo pipefail
          apk="dist/git-calendar-android-${VERSION}.apk"
          if [ "$(gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            # a re-run adds to the same draft
            gh release upload "$VERSION" "$apk" --clobber
          else
            gh release create "$VERSION" \
              --draft \
              --title "v${VERSION}" \
              --target "$GITHUB_SHA" \
              --notes "Built from ${GITHUB_SHA:0:7}. Write the notes, then publish." \
              "$apk"
          fi

      # The R8 mapping turns obfuscated crash stack traces back into readable ones. Kept with the run,
      # not in the release, since it lists the app's internals.
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
